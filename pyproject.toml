[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timber-monitoring"
version = "1.0.0"
description = "Moist-air relations, response model and humidity-led conservation heating for historic timber, from the Rotunda, Woolwich"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Michael Trousdell"}]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
